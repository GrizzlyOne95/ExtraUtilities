name: Linux Host Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'agent/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-host:
    name: Linux host checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # lua5.1 matches what Redux runs; Pillow and numpy back the generated
      # weather billboard textures. The runner has none of them by default.
      # These come from apt rather than pip because the runner's Python is
      # externally managed and refuses a bare pip install.
      - name: Install host check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1 python3-pil python3-numpy

      - name: Run host-side Linux checks
        run: bash tests/linux/run.sh
