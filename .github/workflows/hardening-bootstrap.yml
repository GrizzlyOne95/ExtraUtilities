name: EXU Hardening Bootstrap

on:
  push:
    branches:
      - agent/exu-hardening-pass

permissions:
  contents: write

jobs:
  harden-and-validate:
    runs-on: windows-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply large-file hardening edits
        run: python .github/hardening/apply_once.py

      - name: Validate static invariants
        run: python tools/validate_hardening.py

      - name: Prepare Ogre headers
        shell: pwsh
        run: .\setup-dev.ps1

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build EXU Release x86
        run: msbuild ExtraUtilities.sln /p:Configuration=Release /p:Platform=x86

      - name: Build hardening smoke tests
        run: msbuild tests\HardeningSmoke.vcxproj /p:Configuration=Release /p:Platform=Win32

      - name: Run hardening smoke tests
        run: tests\bin\Release\HardeningSmoke.exe

      - name: Check whitespace
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed" }

      - name: Commit validated hardening pass
        shell: pwsh
        run: |
          git rm .github/hardening/apply_once.py .github/workflows/hardening-bootstrap.yml
          git add -A
          if (git diff --cached --quiet) {
            throw "Hardening bootstrap produced no changes"
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete EXU hardening pass"
          git push origin HEAD:${{ github.ref_name }}
