name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build exu.dll
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate EXU API and hardening invariants
        run: python tools/validate_hardening.py

      - name: Validate generated BZR build profile
        run: python tools/generate_bzr_build_profile.py --check

      - name: Test BZR build qualification tooling
        run: python tools/test_bzr_qualification.py

      - name: Verify version tag matches EXU source version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $about = Get-Content -LiteralPath "src\About.h" -Raw
          if ($about -notmatch 'version\s*=\s*"([^"]+)"') {
            throw "Could not resolve ExtraUtilities::version from src/About.h."
          }
          $sourceVersion = $matches[1]
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          if ($tagVersion -ne $sourceVersion) {
            throw "Release tag '${{ github.ref_name }}' does not match EXU source version '$sourceVersion'."
          }

      # Cache the sparse Ogre header checkout so only the first run per commit
      # pays the clone cost. Key is pinned to the exact Ogre commit used by the
      # vcxproj (f1f1937 = tag v1.10.0). Bump this if Ogre headers ever change.
      - name: Cache Ogre headers
        id: cache-ogre
        uses: actions/cache@v4
        with:
          path: third_party/ogre-1.10.0-bzr/_work
          key: ogre-headers-f1f1937fd6cbad05a4b9170b9882da91f42f53a5

      - name: Checkout Ogre 1.10.0 headers
        if: steps.cache-ogre.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ogreDir = "third_party\ogre-1.10.0-bzr\_work"
          git clone --filter=blob:none --no-checkout `
            https://github.com/OGRECave/ogre.git $ogreDir
          git -C $ogreDir sparse-checkout init --cone
          git -C $ogreDir sparse-checkout set OgreMain/include Components/Overlay/include
          git -C $ogreDir checkout f1f1937fd6cbad05a4b9170b9882da91f42f53a5

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Solution
        run: msbuild ExtraUtilities.sln /p:Configuration=Release /p:Platform=x86

      - name: Build hardening smoke tests
        run: msbuild tests\HardeningSmoke.vcxproj /p:Configuration=Release /p:Platform=Win32

      - name: Run hardening smoke tests
        run: tests\bin\Release\HardeningSmoke.exe

      - name: Verify DLL Output
        shell: pwsh
        run: |
          foreach ($path in @("Release\exu.dll", "Release\exu.pdb")) {
            if (!(Test-Path -LiteralPath $path)) {
              throw "Expected EXU output was not built: $path"
            }
          }

      # Every successful build produces one immutable workflow artifact. A tag
      # release consumes this exact artifact instead of rebuilding the DLL.
      - name: Upload verified EXU artifact
        uses: actions/upload-artifact@v4
        with:
          name: exu-${{ github.sha }}
          path: |
            Release/exu.dll
            Release/exu.pdb
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish EXU release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download exact tested artifact
        uses: actions/download-artifact@v4
        with:
          name: exu-${{ github.sha }}
          path: release

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          test -f release/exu.dll
          test -f release/exu.pdb
          (cd release && sha256sum exu.dll exu.pdb > SHA256SUMS.txt)

      - name: Release DLL and symbols
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/exu.dll
            release/exu.pdb
            release/SHA256SUMS.txt
          generate_release_notes: true
