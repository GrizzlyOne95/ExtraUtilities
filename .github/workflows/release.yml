name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  # The engine-independent contracts (render-effect ABI ids, missionSave
  # decode, render-space math, weather controller) gate a release too, not
  # only pull requests.
  host-tests:
    name: Linux host checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install host check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1 python3-pil python3-numpy

      - name: Run host-side Linux checks
        run: bash tests/linux/run.sh

  build:
    name: Build exu.dll
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate EXU API and hardening invariants
        run: python tools/validate_hardening.py

      - name: Validate generated BZR build profile
        run: python tools/generate_bzr_build_profile.py --check

      - name: Test BZR build qualification tooling
        run: python tools/test_bzr_qualification.py

      - name: Verify version tag matches EXU source version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $about = Get-Content -LiteralPath "src\About.h" -Raw
          if ($about -notmatch 'version\s*=\s*"([^"]+)"') {
            throw "Could not resolve ExtraUtilities::version from src/About.h."
          }
          $sourceVersion = $matches[1]
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          if ($tagVersion -ne $sourceVersion) {
            throw "Release tag '${{ github.ref_name }}' does not match EXU source version '$sourceVersion'."
          }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Build Solution
        run: msbuild ExtraUtilities.sln /p:Configuration=Release /p:Platform=x86

      - name: Build hardening smoke tests
        run: msbuild tests\HardeningSmoke.vcxproj /p:Configuration=Release /p:Platform=Win32

      - name: Run hardening smoke tests
        run: tests\bin\Release\HardeningSmoke.exe

      # The same host tests the Linux lane builds with g++, built with the
      # 32-bit MSVC that exu.dll ships with.
      - name: Build and run host tests with MSVC
        shell: cmd
        run: tests\host\run_msvc.cmd

      - name: Verify DLL Output
        shell: pwsh
        run: |
          foreach ($path in @("Release\exu.dll", "Release\exu.pdb")) {
            if (!(Test-Path -LiteralPath $path)) {
              throw "Expected EXU output was not built: $path"
            }
          }

      # Every successful build produces one immutable workflow artifact. A tag
      # release consumes this exact artifact instead of rebuilding the DLL.
      - name: Upload verified EXU artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exu-${{ github.sha }}
          path: |
            Release/exu.dll
            Release/exu.pdb
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish EXU release
    needs: [build, host-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download exact tested artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: exu-${{ github.sha }}
          path: release

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          test -f release/exu.dll
          test -f release/exu.pdb
          (cd release && sha256sum exu.dll exu.pdb > SHA256SUMS.txt)

      - name: Release DLL and symbols
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release/exu.dll
            release/exu.pdb
            release/SHA256SUMS.txt
          generate_release_notes: true
